<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login — CID</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
  <style>
    :root{
      --bg:#07101f;--card:#0c1829;--border:#1a3050;
      --cyan:#00c8ff;--cyan-dim:rgba(0,200,255,.1);--cyan-glow:rgba(0,200,255,.2);
      --red:#f43f5e;--text:#c8d8e8;--text-dim:#4a6080;--text-hi:#e8f4ff;
      --mono:'JetBrains Mono',monospace;--body:'Inter',sans-serif;
    }
    *{box-sizing:border-box;margin:0;padding:0}
    body{background:var(--bg);font-family:var(--body);min-height:100vh;
         display:flex;align-items:center;justify-content:center;overflow:hidden;}
    body::before{content:'';position:fixed;inset:0;
      background-image:linear-gradient(rgba(0,200,255,.025) 1px,transparent 1px),
                       linear-gradient(90deg,rgba(0,200,255,.025) 1px,transparent 1px);
      background-size:44px 44px;pointer-events:none;}

    .login-box{
      width:100%;max-width:400px;padding:20px;position:relative;z-index:1;
    }
    .logo{text-align:center;margin-bottom:40px;}
    .logo-badge{
      width:70px;height:70px;border-radius:18px;margin:0 auto 16px;
      background:linear-gradient(135deg,var(--cyan),#8b5cf6);
      display:flex;align-items:center;justify-content:center;font-size:32px;
      box-shadow:0 0 40px var(--cyan-glow);
    }
    .logo-title{font-family:var(--mono);font-size:22px;font-weight:700;
                color:var(--text-hi);letter-spacing:4px;}
    .logo-sub{font-size:11px;color:var(--text-dim);letter-spacing:2px;
              text-transform:uppercase;margin-top:6px;}

    .card{background:var(--card);border:1px solid var(--border);
          border-radius:14px;padding:32px;box-shadow:0 20px 60px rgba(0,0,0,.5);}

    .field-label{font-family:var(--mono);font-size:10px;letter-spacing:2px;
                 text-transform:uppercase;color:var(--text-dim);margin-bottom:8px;display:block;}
    .field-input{
      width:100%;background:#0f1e30;border:1px solid var(--border);
      border-radius:8px;color:var(--text-hi);font-family:var(--mono);
      font-size:15px;padding:13px 16px;outline:none;
      transition:border-color .2s,box-shadow .2s;
    }
    .field-input:focus{border-color:var(--cyan);box-shadow:0 0 0 3px var(--cyan-dim);}
    .field-input::placeholder{color:var(--text-dim);}

    .btn-login{
      width:100%;padding:13px;background:var(--cyan);color:#07101f;
      border:none;border-radius:8px;font-family:var(--mono);font-size:12px;
      font-weight:700;letter-spacing:2px;text-transform:uppercase;cursor:pointer;
      transition:all .2s;margin-top:24px;display:flex;align-items:center;justify-content:center;gap:8px;
    }
    .btn-login:hover{background:#28d8ff;box-shadow:0 0 28px var(--cyan-glow);transform:translateY(-1px);}

    .error{
      background:rgba(244,63,94,.1);border:1px solid rgba(244,63,94,.25);
      border-radius:8px;padding:11px 14px;color:var(--red);font-size:13px;
      display:flex;align-items:center;gap:8px;margin-bottom:20px;
    }
    .disclaimer{text-align:center;margin-top:20px;font-size:11px;color:var(--text-dim);line-height:1.6;}

    /* Eye toggle */
    .field-wrap{position:relative;}
    .eye-btn{position:absolute;right:14px;top:50%;transform:translateY(-50%);
             background:none;border:none;color:var(--text-dim);cursor:pointer;font-size:14px;}
    .eye-btn:hover{color:var(--cyan);}
  </style>
</head>
<body>
<div class="login-box">
  <div class="logo">
    <div class="logo-badge">⬡</div>
    <div class="logo-title">CID</div>
    <div class="logo-sub">Cyber Intelligence Dashboard</div>
  </div>

  <div class="card">
    {% if error %}
    <div class="error"><i class="fas fa-exclamation-circle"></i> {{ error }}</div>
    {% endif %}

    <form method="POST">
      <div style="margin-bottom:20px;">
        <label class="field-label">Access Password</label>
        <div class="field-wrap">
          <input class="field-input" type="password" name="password"
                 id="passInput" placeholder="Enter password..."
                 autofocus autocomplete="current-password"/>
          <button type="button" class="eye-btn" onclick="togglePass()">
            <i class="fas fa-eye" id="eyeIcon"></i>
          </button>
        </div>
      </div>
      <button class="btn-login" type="submit">
        <i class="fas fa-shield-alt"></i> ACCESS SYSTEM
      </button>
    </form>

    <div class="disclaimer">
      Educational &amp; research use only.<br/>
      Unauthorized use is prohibited.
    </div>
  </div>
</div>
<script>
function togglePass(){
  const inp=document.getElementById('passInput');
  const ico=document.getElementById('eyeIcon');
  if(inp.type==='password'){inp.type='text';ico.className='fas fa-eye-slash';}
  else{inp.type='password';ico.className='fas fa-eye';}
}
</script>
</body>
</html>
