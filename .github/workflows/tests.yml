name: tests
on:
  push:
  pull_request:
jobs:
  offline-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements-dev.txt
      - run: python -m compileall -q app.py db.py pdf_gen.py phone_osint.py scheduler.py threat.py target_validation.py
      - run: pytest -q
